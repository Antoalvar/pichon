<div class="content-wrapper" [class.self]="selfClass()">


  @if (!subscriptionSuccess()) {
  <div class="form-wrapper">
    <div class="email-label">
      <label for="email">Nombre*</label>
    </div>
    <input
      [formControl]="subscriptionName"
      type="text"
      id="name"
      pattern="Jane Doe"
      size="30"
      required
    />

    <div class="email-label">
      <label for="email">Email*</label>
    </div>
    <input
      [formControl]="subscriptionEmail"
      type="email"
      id="email"
      pattern=".+@example\.com"
      size="30"
      required
    />
  </div>
  <div class="subscribe-button-wrapper">
    <div class="subscribe-button" (click)="sendSubscriptionEmail()">
      <span>👉 Suscríbete gratis</span>
    </div>
  </div>
  } @else {
  <p>Suscripción realizada con éxito. Gracias!!</p>
  }
</div>
