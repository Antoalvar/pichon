<main class="guias-container">
  <h1 class="visually-hidden">Guías — Pichón</h1>
  <div class="guides-wrapper">
    @for (guide of guides(); track $index) {
      <article class="guide-item-wrap">
        <div class="img-wrapper">
          <img [src]="guide.image" [alt]="guide.title" loading="lazy" />
          <div class="img-overlay">
            <button type="button" (click)="openModal(guide)">Descárgala ahora</button>
          </div>
        </div>
        <div class="guide-info">
          <div class="title">
            <h2>{{ guide.title }}</h2>
          </div>
          <div class="description">
            <p>{{ guide.description }}</p>
          </div>
        </div>
      </article>
    }
  </div>
</main>@if (selectedGuide(); as guide) {
  <app-guide-download-modal
    title="Descarga tu guía"
    [subtitle]="'Introduce tu dirección de correo electrónico para descargar tu ' + guide.title"
    [successUrl]="guide.pdfUrl"
    (close)="closeModal()"
  ></app-guide-download-modal>
}
