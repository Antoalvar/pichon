<main class="blog-container">
  <h1 class="visually-hidden">Blog — Pichón</h1>
  <div class="index-wrapper">
    @for (category of categories(); track $index) { @if ($index !== 0) {
    <b> • </b>
    }
    <div class="section-wrapper" (click)="selectSection(category)">
      <div
        class="description"
        [class.selected]="category.name.toLowerCase() === selectedCategory()"
      >
        <span>{{ category.name }}</span>
      </div>
    </div>
    }
  </div>
  <div class="posts-wrapper">
    @for (post of posts(); track $index) {
    <article class="blog-item-wrap" (click)="navigateToPost(post)">
      <div class="img-wrapper">
        <img [src]="post.thumbnail_url" [alt]="post.title" loading="lazy" />
      </div>
      <div class="post-info">
        <div class="categories">
          @for (category of post.category_name; track $index) {
          <p>{{ category.toUpperCase() }}</p>
          }
        </div>
        <div class="title">
          <h2>{{ post.title.toUpperCase() }}</h2>
        </div>
        <div class="abstract">
          <p>{{ post.abstract }}</p>
        </div>
      </div>
    </article>
    }
  </div>
</main>
