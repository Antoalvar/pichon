<header class="bo-header">
  <h1>{{ pageTitle() }}</h1>

  <div class="bo-header-actions">
    <button
      type="button"
      class="btn btn--preview"
      [disabled]="!isFormValid()"
      (click)="previewClick.emit()"
    >
      <span class="material-symbols-outlined">preview</span>
      Vista previa
    </button>

    <button
      type="button"
      class="btn btn--publish"
      [disabled]="!isFormValid() || isSubmitting()"
      [attr.aria-busy]="isSubmitting()"
      (click)="publishClick.emit()"
    >
      <span class="material-symbols-outlined">
        {{ isSubmitting() ? 'hourglass_top' : (mode() === 'edit' ? 'save' : 'publish') }}
      </span>
      {{ submitLabel() }}
    </button>
  </div>
</header>

@if (submitSuccess()) {
  <div class="bo-banner bo-banner--success" role="status" aria-live="polite">
    <span class="material-symbols-outlined">check_circle</span>
    {{ successMessage() }}
  </div>
}

@if (submitError()) {
  <div class="bo-banner bo-banner--error" role="alert" aria-live="assertive">
    <span class="material-symbols-outlined">error</span>
    {{ submitError() }}
  </div>
}
