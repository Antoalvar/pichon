<div class="back-office-container">
  <app-bo-action-bar
    [isSubmitting]="facade.isSubmitting()"
    [isFormValid]="facade.isFormValid()"
    [submitSuccess]="facade.submitSuccess()"
    [submitError]="facade.submitError()"
    (previewClick)="facade.preview()"
    (publishClick)="facade.submit()"
  />

  <form [formGroup]="facade.form" class="bo-form">
    <section class="bo-section">
      <h2 class="section-title">Información básica</h2>
      <app-bo-meta-fields
        [availableCategories]="facade.availableCategories()"
        [selectedCategories]="facade.selectedCategories()"
        [thumbnailUrl]="facade.thumbnailUrl()"
        (categoryToggle)="facade.toggleCategory($event)"
      />
    </section>

    <section class="bo-section">
      <h2 class="section-title">Contenido</h2>
      <app-bo-block-list
        [blockGroups]="facade.blockGroups()"
        [editorMap]="facade.editorMap()"
        [blockTypeOptions]="facade.blockTypeOptions"
        [paragraphToolbar]="facade.paragraphToolbar"
        (addBlock)="facade.addBlock($event)"
        (removeBlock)="facade.removeBlock($event)"
      />
    </section>
  </form>
</div>
