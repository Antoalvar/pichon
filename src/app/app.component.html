<div class="safe-area-fill"></div>
<app-navbar (agendaOpen)="showAgendaModal.set(true)"></app-navbar>
<router-outlet />

<footer class="footer">
  @if (isSubscribeButtonVisible()) {
  <div class="subscribe-button-wrapper">
    <div class="subscribe-button" (click)="showModal()">
      <span>Suscríbete</span>
    </div>
  </div>
  }
  <div class="actions-footer">
    <div class="instagram-icon" (click)="openInstagram()">
      <img src="./../assets/images/instagram.png" alt="Pichón en Instagram" loading="lazy" />
    </div>
  </div>
</footer>
@if (isSubscribeModalVisible) {
<app-subscribe (close)="hideModal()"></app-subscribe>
}
@if (showAgendaModal()) {
  <app-guide-download-modal
    title="Descarga tu agenda"
    subtitle="Suscríbete a nuestra newsletter y descárgate grátis la agenda de este mes"
    successUrl="/assets/agenda/agenda.pdf"
    (close)="showAgendaModal.set(false)"
  ></app-guide-download-modal>
}
